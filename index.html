      --primary-dark: #E5A500;

      --text-secondary: #666666;
      --text-muted: #999999;

      --shadow: rgba(0, 0, 0, 0.06);

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Noto Sans CJK SC", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;

    /* ===== 顶部导航 ===== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .navbar .title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .navbar .btn-post {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(255, 184, 0, 0.3);
    }
    .navbar .btn-post:hover { background: var(--primary-dark); }
    .navbar .btn-post:active { transform: scale(0.96); }

    /* ===== Token 校验遮罩 ===== */
    .token-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .token-overlay.hidden { display: none; }
    .token-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);

    .token-card h3 { font-size: 18px; margin-bottom: 12px; color: var(--text-primary); }

    .token-card .error { color: var(--danger); font-weight: 500; }
    .token-card .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 分类标签 ===== */
    .categories {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);

      font-weight: 500;
      background: var(--bg);
      border: 1px solid var(--border);

      color: var(--text-secondary);

    .post-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }
    .post-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 1px 4px var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;

      -webkit-box-orient: vertical;
      overflow: hidden;

      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .post-card .post-meta .avatar {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--primary-light);
    }
    .post-card .post-meta .like-icon {
      color: var(--accent);
    }

    /* ===== 发布弹窗 ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      align-items: flex-end;
      animation: fadeIn 0.2s;
    }
    .modal-overlay.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-content {

      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px 20px 32px;
      margin: 0 auto;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-content h3 {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      color: var(--text-primary);
    }
    .modal-content .close-bar {
      width: 36px; height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg);
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--card-bg);
    }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .image-upload-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .image-upload-area .add-img {
      width: 84px; height: 84px;
      border: 2px dashed var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;

      cursor: pointer;
      background: var(--bg);

    }
    .image-upload-area .add-img:hover { border-color: var(--primary); }
    .image-upload-area .preview-img {
      width: 84px; height: 84px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 1px 4px var(--shadow);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
      box-shadow: 0 4px 12px rgba(255, 184, 0, 0.3);
    }
    .btn-submit:hover { background: var(--primary-dark); }
    .btn-submit:active { transform: scale(0.97); }
    .btn-cancel {
      width: 100%;
      padding: 14px;
      background: var(--bg);
      color: var(--text-secondary);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-cancel:hover { background: var(--border); }

    /* ===== 空状态 ===== */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-state .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    /* ===== 底部导航栏 ===== */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 0 6px;
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
    }
    .tab-item.active { color: var(--primary); }
    .tab-item .tab-icon { font-size: 22px; margin-bottom: 2px; }

<body>

  <!-- Token 校验遮罩 -->
  <div class="token-overlay" id="tokenOverlay">
    <div class="token-card">
      <div class="spinner" id="tokenSpinner"></div>
      <h3 id="tokenTitle">正在验证访问权限...</h3>
      <p id="tokenMessage">请稍候</p>
    </div>
  </div>

  <!-- 顶部导航 -->
  <div class="navbar" id="navbar" style="display:none;">
    <div class="title">投稿站</div>
    <button class="btn-post" onclick="openPostModal()">+ 发布</button>
  </div>

  <!-- 分类标签 -->
  <div class="categories" id="categories" style="display:none;">
    <button class="cat-tag active" onclick="filterPosts('all', this)">推荐</button>
    <button class="cat-tag" onclick="filterPosts('日常', this)">日常</button>
    <button class="cat-tag" onclick="filterPosts('美食', this)">美食</button>
    <button class="cat-tag" onclick="filterPosts('旅行', this)">旅行</button>
    <button class="cat-tag" onclick="filterPosts('穿搭', this)">穿搭</button>
    <button class="cat-tag" onclick="filterPosts('其他', this)">其他</button>
  </div>

  <!-- 投稿列表 -->
  <div class="post-grid" id="postGrid" style="display:none;"></div>

  <!-- 底部占位（为固定tab bar预留空间） -->
  <div id="tabSpacer" style="display:none; height: 60px;"></div>

  <!-- 底部导航栏 -->
  <div class="tab-bar" id="tabBar" style="display:none;">
    <div class="tab-item active" onclick="switchTab('home', this)">
      <span class="tab-icon">🏠</span>
      <span>首页</span>
    </div>
    <div class="tab-item" onclick="switchTab('discover', this)">
      <span class="tab-icon">🔍</span>
      <span>发现</span>
    </div>
    <div class="tab-item" onclick="switchTab('publish', this)">
      <span class="tab-icon">✏️</span>
      <span>投稿</span>
    </div>
    <div class="tab-item" onclick="switchTab('profile', this)">
      <span class="tab-icon">👤</span>
      <span>我的</span>
    </div>
  </div>

  <!-- 发布弹窗 -->
  <div class="modal-overlay" id="postModal">
    <div class="modal-content">
      <div class="close-bar"></div>
      <h3>发布投稿</h3>
      <div class="form-group">
        <label>标题</label>
        <input type="text" id="postTitle" placeholder="填写标题..." maxlength="50">
      </div>
      <div class="form-group">
        <label>内容</label>
        <textarea id="postContent" placeholder="分享你的故事..." maxlength="2000"></textarea>
      </div>
      <div class="form-group">
        <label>分类</label>
        <select id="postCategory">
          <option value="日常">日常</option>
          <option value="美食">美食</option>
          <option value="旅行">旅行</option>
          <option value="穿搭">穿搭</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>图片（最多9张）</label>
        <div class="image-upload-area" id="imageArea">
          <div class="add-img" onclick="document.getElementById('imageInput').click()">+</div>
        </div>
        <input type="file" id="imageInput" accept="image/*" multiple="" style="display:none;" onchange="handleImageSelect(event)">
      </div>
      <button class="btn-submit" onclick="submitPost()">发布</button>
      <button class="btn-cancel" onclick="closePostModal()">取消</button>
    </div>
  </div>

  <!-- ==================== JavaScript ==================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ==========================================
    // 配置区域 - 部署时替换为你的真实值
    // ==========================================

    // Supabase 配置（在 Supabase 控制台 → Settings → API 中获取）
    const SUPABASE_URL = 'https://你的项目ID.supabase.co'
    const SUPABASE_ANON_KEY = '你的anon-key'

    // 微信云开发配置（用于H5端调用云函数校验Token）
    // 需要在云开发控制台 → 设置 → 全局设置 中开启"未登录模式"
    const WX_CLOUD_ENV_ID = '你的云开发环境ID'

    // 初始化 Supabase 客户端
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    // ==========================================
    // 全局状态
    // ==========================================
    let currentCategory = 'all'
    let selectedImages = []  // 存储待上传图片的 base64
    let tokenVerified = false

    // ==========================================
    // Token 校验（页面加载时自动执行）
    // ==========================================
    async function verifyToken() {
      const overlay = document.getElementById('tokenOverlay')
      const spinner = document.getElementById('tokenSpinner')
      const title = document.getElementById('tokenTitle')
      const message = document.getElementById('tokenMessage')

      // 从 URL 获取 Token
      const urlParams = new URLSearchParams(window.location.search)
      const token = urlParams.get('t')

      if (!token) {
        // 没有 Token → 直接显示拒绝
        spinner.style.display = 'none'
        title.textContent = '无法访问'
        message.textContent = '请从小程序内获取访问链接'
        message.classList.add('error')
        return
      }

      try {
        // 调用微信云函数校验 Token
        const result = await callCloudFunction('verifyToken', { token })

        if (result.valid) {
          // 校验通过 → 隐藏遮罩，显示内容
          tokenVerified = true
          overlay.classList.add('hidden')
          showContent()
        } else {
          // 校验失败 → 显示具体原因
          spinner.style.display = 'none'
          title.textContent = '访问失败'
          message.textContent = result.message || '链接无效，请重新获取'
          message.classList.add('error')
        }
      } catch (err) {
        spinner.style.display = 'none'
        title.textContent = '验证出错'
        message.textContent = '网络错误，请稍后重试'
        message.classList.add('error')
      }
    }

    // H5 端调用微信云函数（通过 Vercel API 路由代理）
    async function callCloudFunction(name, data) {
      const response = await fetch('/api/cloud-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ functionName: name, data: data })
      })
      return await response.json()
    }

    // ==========================================
    // 显示内容
    // ==========================================
    function showContent() {
      document.getElementById('navbar').style.display = 'flex'
      document.getElementById('categories').style.display = 'flex'
      document.getElementById('postGrid').style.display = 'grid'
      document.getElementById('tabBar').style.display = 'flex'
      document.getElementById('tabSpacer').style.display = 'block'
      loadPosts()
    }

    // ==========================================
    // 加载投稿列表
    // ==========================================
    async function loadPosts() {
      const grid = document.getElementById('postGrid')
      grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>加载中...</p></div>'

      try {
        let query = supabase
          .from('posts')
          .select('*, users(username, avatar_url)')
          .order('created_at', { ascending: false })
          .limit(20)

        if (currentCategory !== 'all') {
          query = query.eq('category', currentCategory)
        }

        const { data: posts, error } = await query

        if (error) throw error

        if (!posts || posts.length === 0) {
          grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><p>暂无投稿，快来发布第一条吧</p></div>'
          return
        }

        grid.innerHTML = posts.map(post => `
          <div class="post-card" onclick="viewPost('${post.id}')">
            ${post.images && post.images.length > 0
              ? `<img src="${post.images[0]}" alt="${post.title}" loading="lazy">`
              : '<img src="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%23FFF8E8%22 width=%22200%22 height=%22200%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23FFB800%22 font-size=%2220%22>暂无图片</text></svg>" alt="默认">'
            }
            <div class="post-info">
              <div class="post-title">${escapeHtml(post.title)}</div>
              <div class="post-meta">
                <div class="avatar"></div>
                <span>${escapeHtml(post.users?.username || '匿名')}</span>
                <span class="like-icon">♥</span>
                <span>${post.likes_count || 0}</span>
              </div>
            </div>
          </div>
        `).join('')
      } catch (err) {
        grid.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>加载失败: ${err.message}</p></div>`
      }
    }

    // ==========================================
    // 分类筛选
    // ==========================================
    function filterPosts(category, btn) {
      currentCategory = category
      document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'))
      btn.classList.add('active')
      loadPosts()
    }

    // ==========================================
    // 底部Tab切换
    // ==========================================
    function switchTab(tab, el) {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'))
      el.classList.add('active')
      if (tab === 'publish') {
        openPostModal()
      }
    }

    // ==========================================
    // 发布投稿弹窗
    // ==========================================
    function openPostModal() {
      document.getElementById('postModal').classList.add('show')
    }
    function closePostModal() {
      document.getElementById('postModal').classList.remove('show')
      document.getElementById('postTitle').value = ''
      document.getElementById('postContent').value = ''
      selectedImages = []
      renderImagePreviews()
    }

    // ==========================================
    // 图片选择与预览
    // ==========================================
    function handleImageSelect(event) {
      const files = Array.from(event.target.files)
      const remaining = 9 - selectedImages.length
      const toProcess = files.slice(0, remaining)

      if (files.length > remaining) {
        alert(`最多上传9张图片，还能选${remaining}张`)
      }

      toProcess.forEach(file => {
        const reader = new FileReader()
        reader.onload = (e) => {
          selectedImages.push(e.target.result)
          renderImagePreviews()
        }
        reader.readAsDataURL(file)
      })
      event.target.value = ''
    }

    function renderImagePreviews() {
      const area = document.getElementById('imageArea')
      const addBtn = '<div class="add-img" onclick="document.getElementById(\'imageInput\').click()">+</div>'
      const previews = selectedImages.map((src, i) =>
        `<img class="preview-img" src="${src}" alt="预览${i+1}" onclick="removeImage(${i})">`
      ).join('')
      area.innerHTML = previews + (selectedImages.length < 9 ? addBtn : '')
    }

    function removeImage(index) {
      selectedImages.splice(index, 1)
      renderImagePreviews()
    }

    // ==========================================
    // 提交投稿
    // ==========================================
    async function submitPost() {
      const title = document.getElementById('postTitle').value.trim()
      const content = document.getElementById('postContent').value.trim()
      const category = document.getElementById('postCategory').value

      if (!title) { alert('请填写标题'); return }
      if (!content) { alert('请填写内容'); return }

      try {
        const { data, error } = await supabase.from('posts').insert({
          title,
          content,
          category,
          images: []
        }).select()

        if (error) {
          if (error.code === '42501') {
            alert('请先登录后再发布')
          } else {
            throw error
          }
          return
        }

        alert('发布成功!')
        closePostModal()
        loadPosts()
      } catch (err) {
        alert('发布失败: ' + err.message)
      }
    }

    // ==========================================
    // 工具函数
    // ==========================================
    function escapeHtml(text) {
      const div = document.createElement('div')
      div.textContent = text || ''
      return div.innerHTML
    }

    function viewPost(id) {
      alert('投稿详情页开发中，ID: ' + id)
    }

    // ==========================================
    // 页面加载时自动校验 Token
    // ==========================================
    document.addEventListener('DOMContentLoaded', verifyToken)
  </script>
